# Build both packages on native hardware and, on a tag, publish them.
#
# The Windows build has so far only ever been made inside a Parallels VM on an Apple Silicon Mac —
# an ARM machine running an x64 Python under emulation. It produces the right artifact, but it is
# a strange place for a release to come from, and it is the developer's laptop. Here each platform
# is built on its own architecture: macos-14 is Apple Silicon, windows-latest is x64.
#
# The dependency list is not written down twice. It IS Mate's own requirements plus the two things
# only the shell needs, which is the invariant the whole design rests on: a shell that can satisfy
# every import the payload makes. Pinning a separate list here would let the two drift apart
# silently, and the first sign would be somebody's app failing on an import after an update.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mate_ref:
        description: "Mate tag to seed the payload from (blank = its latest release)"
        required: false
        type: string

permissions:
  contents: write        # the release job
  id-token: write        # build provenance: GitHub signs the attestation with a short-lived token
  attestations: write    # …and stores it against the repository

env:
  MATE_REPO_URL: https://github.com/ProtossBlaster/leapmotor-mate.git

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # The seed payload always comes from a RELEASED Mate, never from whatever main happens to be
      # mid-way through. It is only a seed — the app updates itself on first launch — but a build
      # that shipped an untagged commit would be impossible to describe afterwards.
      - name: Fetch Mate
        run: |
          git clone --quiet "$MATE_REPO_URL" mate-src
          cd mate-src
          REF="${{ inputs.mate_ref }}"
          [ -n "$REF" ] || REF="$(git describe --tags --abbrev=0)"
          git checkout --quiet "$REF"
          echo "seeding from Mate $REF"
          # Published beside the packages so Mate's own CI can read it back. The shell carries
          # exactly the libraries these two requirements files asked for at THIS tag, so this one
          # line is enough for Mate to answer "would today's release still run on the shell people
          # already have?" without anybody having to remember to ask.
          echo "$REF" > "$GITHUB_WORKSPACE/payload-seed.txt"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Build environment
        run: |
          python -m venv buildenv
          ./buildenv/bin/python -m pip install --quiet --upgrade pip
          ./buildenv/bin/python -m pip install --quiet \
            -r mate-src/poller/requirements.txt \
            -r mate-src/web/requirements.txt \
            pywebview pyinstaller pytest

      - name: Unit tests
        run: ./buildenv/bin/python -m pytest -q test_autostart.py test_plat_win.py

      - name: Build the app and the disk image
        env:
          MATE_REPO: ${{ github.workspace }}/mate-src
        run: |
          ./build_mac.sh
          ./make_dmg.sh

      # Provenance: a signed statement that THIS file came out of THIS commit, in this workflow,
      # on GitHub's own runner. Free, and it is the part of "who made this" that does not depend
      # on paying a certificate authority.
      #
      # What it is worth, honestly: an ordinary user will never run `gh attestation verify`, so
      # this does nothing for them — only a code signature, which the operating system checks by
      # itself, does. What it does do is make it impossible to publish a binary whose origin
      # cannot be shown: no laptop build can carry one of these, so if a file has an attestation
      # it was built here, from a commit anyone can read.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/*.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: payload-seed
          path: payload-seed.txt
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Fetch Mate
        shell: bash
        run: |
          git clone --quiet "$MATE_REPO_URL" mate-src
          cd mate-src
          REF="${{ inputs.mate_ref }}"
          [ -n "$REF" ] || REF="$(git describe --tags --abbrev=0)"
          git checkout --quiet "$REF"
          echo "seeding from Mate $REF"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build environment
        run: |
          python -m venv buildenv
          .\buildenv\Scripts\python.exe -m pip install --quiet --upgrade pip
          .\buildenv\Scripts\python.exe -m pip install --quiet `
            -r mate-src\poller\requirements.txt `
            -r mate-src\web\requirements.txt `
            pywebview pyinstaller pytest

      - name: Unit tests
        run: .\buildenv\Scripts\python.exe -m pytest -q test_autostart.py test_plat_win.py

      # Present on some runner images and not others, and build_win.ps1 only WARNS when it is
      # missing — which on a release run would mean an app with no installer and a green tick.
      - name: Inno Setup
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
              choco install innosetup -y --no-progress
          }
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      # The same thought as Inno, which somebody had for one tool and not the other — and this is
      # the one that bit: no WiX on the runner, build_win.ps1 warns instead of failing, and the
      # first real release run went green carrying an .exe and no .msi at all. The .msi is the
      # primary Windows download.
      #
      # Version 5 deliberately: 6 and later refuse to build until the Open Source Maintenance Fee
      # licence is accepted, and accepting a licence on somebody's behalf is not a build step.
      - name: WiX 5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the app and the installer
        env:
          MATE_REPO: ${{ github.workspace }}\mate-src
        run: .\build_win.ps1

      # build_win.ps1 warns rather than fails when a toolchain is missing. That is right on a
      # laptop, where you may only want the .exe, and wrong here: `if-no-files-found: error` on the
      # upload does not help either, since one matching file satisfies it. A release that quietly
      # ships half its installers is worse than one that does not ship.
      - name: Both installers are actually there
        run: |
          $msi = Get-ChildItem dist\*.msi -ErrorAction SilentlyContinue
          $exe = Get-ChildItem dist\*Setup*.exe -ErrorAction SilentlyContinue
          if (-not $msi) { throw "no .msi in dist - WiX did not run" }
          if (-not $exe) { throw "no setup .exe in dist - Inno did not run" }
          Write-Host ("  {0}  {1} MB" -f $msi.Name, [math]::Round($msi.Length/1MB))
          Write-Host ("  {0}  {1} MB" -f $exe.Name, [math]::Round($exe.Length/1MB))

      # What actually leaves this job is the zip, and the loose installers do not ship at all.
      #
      # Chromium puts .exe and .msi in a category that REQUIRES an explicit click before it will
      # even give the file its name, whenever that file has no reputation — and a new unsigned
      # installer never has any. What the person sees is a Downloads folder with no .msi and no
      # .exe in it, just "Unconfirmed 123456.crdownload". That is indistinguishable from a failed
      # download, and within an hour of the first release two people reported exactly that. Both
      # files had arrived, complete, and were sitting there nameless.
      #
      # A .zip is not in that category. Tested rather than assumed, on a real Windows machine:
      # the same installer, zipped, comes down under its own name and opens normally. The blue
      # panel when you RUN it is untouched — that one is expected and people know it.
      #
      # Zipped HERE rather than at release time so the attestation below covers the file that is
      # actually published: attesting the .msi and then shipping a .zip nobody attested would be
      # a provenance claim about something the download page does not offer.
      - name: Zip the installers
        run: Get-ChildItem dist\*.msi, dist\*Setup*.exe | ForEach-Object {
               Compress-Archive -Path $_.FullName -DestinationPath "$($_.FullName).zip" -Force }

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          # The zips as well as what is inside them: the zip is what the release page hands out,
          # so it is the zip somebody will run `gh attestation verify` against.
          subject-path: |
            dist/*.msi
            dist/*Setup*.exe
            dist/*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-x64
          # BOTH packages. The .msi is the one people download; the Inno .exe is kept alongside
          # it. An earlier version of this listed only the .exe, so a release would have shipped
          # without the main package and the tick would still have been green.
          path: |
            dist/*.msi
            dist/*Setup*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      # Neither package is signed, so the only thing a careful person can check is the checksum.
      # It is worth nothing unless it is published somewhere other than next to the file, which is
      # what the release notes are for.
      - name: Checksums
        # Neither package is signed, so a checksum is the only thing a careful person can check —
        # and it is worth publishing only if it is USABLE. That means three things, and the first
        # version of this step had none of them: a SHA256SUMS file people can feed to a tool, the
        # values in the notes as well (so they survive on a page that is hard to tamper with
        # quietly), and the command to run, for both systems, next to them.
        #
        # Be clear about what this does and does not do. It catches a corrupted download and a
        # file swapped on a mirror or passed around by hand. It does NOT prove the file is ours:
        # anyone who could replace the download could replace the page it is listed on. Only a
        # code signature, which the operating system checks by itself, does that.
        run: |
          cd artifacts
          # The loose .msi and .exe are deliberately NOT collected: Windows ships zipped, for the
          # reason set out in the Windows job. They stay behind as build artifacts on the run.
          find . -type f \( -name '*.dmg' -o -name '*.zip' -o -name 'payload-seed.txt' \) -exec mv -f {} . \;
          rmdir */ 2>/dev/null || true
          sha256sum *.dmg *.zip > SHA256SUMS
          {
            echo "Built from Mate **$(cat payload-seed.txt)**, which is the version inside the"
            echo "installer. The app fetches whatever is newest on first launch, so this only"
            echo "matters if you open it with no internet."
            echo
            echo "### Verifying what you downloaded"
            echo
            echo "Neither package is signed, so this is the one check available. It catches a"
            echo "corrupted or swapped file; it cannot prove the file is ours."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "**Windows** — in PowerShell, in the folder you downloaded to:"
            echo '```powershell'
            echo 'Get-FileHash .\LeapMotor-Mate-*.zip -Algorithm SHA256 | Format-List'
            echo '```'
            echo
            echo "**macOS** — in Terminal:"
            echo '```bash'
            echo 'shasum -a 256 ~/Downloads/LeapMotor-Mate-*.dmg'
            echo '```'
            echo
            echo "The value it prints must match the line above for that file, character for character."
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/payload-seed.txt
            artifacts/SHA256SUMS
          body_path: artifacts/notes.md
          draft: true         # a human reads it, adds the changelog, and presses publish
