# Keeps the pinned actions from freezing forever.
#
# Every `uses:` in .github/workflows is pinned to a commit SHA rather than a moving tag, because a
# tag is a pointer somebody else controls: whoever can move `@v2` can run their own code inside the
# release job, which holds `contents: write` and signs the build provenance. A SHA cannot be
# re-pointed.
#
# The cost of that is the mirror image — pinned actions never pick up a fix on their own. Dependabot
# closes it: it reads the `# v2` comment beside each SHA, and opens a PR that moves the SHA and the
# comment together, with the action's release notes attached. Monthly on purpose: security fixes in
# these actions are rare, and a weekly PR nobody reads is how a repo learns to ignore them.
#
# Minor and patch only. Left unfiltered, the first run proposed five MAJOR jumps at once, one of
# them four versions wide (download-artifact 4 → 8) — the workflows had been sitting on tags their
# authors had long moved past. A major bump can change behaviour, and this is the chain that builds
# the installers and attests where they came from, so it is not something to accept from a bot.
# Majors stay a decision somebody makes on purpose, having read the release notes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
